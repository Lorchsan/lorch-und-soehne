    gebaeude: Alte Bibliothek der Humboldt-Universität
    strasse: Bebelplatz 2
    plz_ort: 10117 Berlin
    stadtteil: Mitte

  # Erscheint auf: Startseite (Anfahrt), Kommode-Seite und für Google.
  oeffnungszeiten:
    - tage: Montag–Freitag
      zeit: 08:00–18:00 Uhr
    - tage: Samstag–Sonntag
      zeit: geschlossen

  # Pott Kaffee für HU-Studierende (ohne €).
  # ★ Erscheint an DREI Stellen: Kommode-Seite im Text („… für einen
  #   Pott Kaffee für 1,50“), als Überschrift („Ein Pott Kaffee. 1,50 €.“)
  #   und unsichtbar in der Google-Beschreibung der Kommode-Seite.
  pott_kaffee_preis: 1,50

  # Schloss für die Bibliothek (Kommode-Seite, „Noch ein Schloss für die Bib?“)
  schloss:
    rueckgabe_bis: 18 Uhr          # im Satz „… am selben Tag bis 18 Uhr …“
    leihgebuehr: 1,00 € pro Tag    # genau so, wie es dasteht (mit €)
    pfand: 10,00                   # ohne €
