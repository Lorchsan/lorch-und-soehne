# =====================================================================
#  LORCH & SÖHNE – INHALTE DER WEBSITE
# =====================================================================
#
#  Hier stehen alle Angaben, die sich öfter ändern: Kontakt, Adressen,
#  Öffnungszeiten und die Speisekarte der Danziger Straße.
#
#  ALLES AKTIV: Jede Angabe hier wird auf die Website übernommen
#  (python3 aktualisieren.py – später automatisch über GitHub).
#
#  ---------------------------------------------------------------------
#  SO ÄNDERST DU ETWAS
#  ---------------------------------------------------------------------
#  • Nur den Text HINTER dem Doppelpunkt ändern.
#  • Die Einrückung (Leerzeichen am Zeilenanfang) genau so lassen.
#    Immer Leerzeichen, nie Tab.
#  • Preise ohne „€“ schreiben, mit Komma: 3,70
#    (3,7 oder 3.70 wird automatisch zu 3,70 korrigiert)
#  • „–“ bei einem Preis heißt: gibt es nicht (z. B. Flat White einfach).
#  • Neue Zeile auf der Karte: eine vorhandene Zeile (beginnt mit „- name“)
#    samt ihrer Zeilen darunter kopieren und anpassen.
#  • Zeile löschen: die Zeile mit „- name“ und die dazugehörigen Zeilen
#    darunter löschen.
#  • Alles hinter einem # ist eine Erklärung und erscheint nicht auf der Seite.
#
#  ---------------------------------------------------------------------
#  BEISPIEL: EINE ZEILE AUF DER KARTE HINZUFÜGEN ODER LÖSCHEN
#  ---------------------------------------------------------------------
#  Jeder Eintrag auf der Karte besteht aus zwei oder drei Zeilen:
#
#        - name: Süßer Lorch                       ← Name, beginnt mit „- “
#          preis: 4,30                             ← Preis ohne €
#          zutaten: Croissant, Marmelade, Butter   ← freiwillig
#
#  HINZUFÜGEN (z. B. ein Croissant beim Frühstück):
#    1. Einen vorhandenen Eintrag markieren und kopieren.
#    2. An der Stelle einfügen, an der er auf der Karte stehen soll
#       (die Reihenfolge hier = die Reihenfolge auf der Website).
#    3. Name, Preis und Zutaten ändern. Keine Zutaten? Zeile weglassen.
#
#        - name: Croissant
#          preis: 2,80
#
#  LÖSCHEN (z. B. „Bircher Müsli klein“):
#    Die Zeile „- name: Bircher Müsli klein“ und die Zeilen direkt
#    darunter („preis“, „zutaten“) löschen – bis zum nächsten „- name“.
#
#  WICHTIG – die Einrückung:
#    • „- name“ steht genau so weit eingerückt wie die anderen Einträge.
#    • „preis“ und „zutaten“ stehen zwei Leerzeichen weiter rechts,
#      genau unter dem „n“ von „name“.
#    • Am einfachsten: immer einen vorhandenen Eintrag kopieren,
#      dann stimmt die Einrückung von selbst.
#
#  Passiert doch ein Fehler, wird die Website NICHT kaputt: Die
#  Automatik prüft die Datei und lädt dann einfach nichts hoch.
#  Die alte Seite bleibt online.
#
#  Wo eine Angabe auf der Website überall auftaucht, steht jeweils
#  darüber (★ = erscheint an MEHREREN Stellen). Du änderst sie nur
#  hier einmal – die Automatik ändert alle Stellen gemeinsam.
# =====================================================================


# ---------------------------------------------------------------------
#  KONTAKT
# ---------------------------------------------------------------------
kontakt:
  # Erscheint auf: Kontakt, Catering, Impressum, Datenschutz.
  # Wird automatisch vor Spam geschützt (rückwärts gespeichert).
  email: christoph.lorch@posteo.de


# ---------------------------------------------------------------------
#  CAFÉ DANZIGER STRASSE
# ---------------------------------------------------------------------
danziger:

  # Erscheint auf: Startseite (Anfahrt), Danziger-Seite („Komm vorbei!“),
  # Impressum, Datenschutz und unsichtbar für Google.
  adresse:
    strasse: Danziger Straße 25
    plz_ort: 10435 Berlin
    stadtteil: Prenzlauer Berg

  # Erscheint auf: Startseite (Anfahrt), Danziger-Seite und für Google.
  # Zeiten immer so schreiben: 08:00–17:00 Uhr  – oder: geschlossen
  oeffnungszeiten:
    - tage: Montag–Freitag
      zeit: 08:00–17:00 Uhr
    - tage: Samstag–Sonntag
      zeit: 09:00–17:00 Uhr

